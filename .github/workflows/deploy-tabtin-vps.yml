name: Deploy TabTin VPS
run-name: >-
  Deploy PR #${{ github.event.pull_request.number }} ·
  ${{ github.event.pull_request.title }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: tabtin-vps-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kaestnerheisser207-web/tabtin-community-django
  RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Calculate Django dependency fingerprint
        id: dependencies
        run: |
          set -euo pipefail
          fingerprint="$(sha256sum apps/tabtin_django/requirements.txt | awk '{print $1}')"
          test "${#fingerprint}" -eq 64
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable Django image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tabtin_django/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          build-args: |
            BASE_IMAGE=python:3.11-slim
            INSTALL_PLAYWRIGHT=true
            TABTIN_DEV_DEPENDENCY_FINGERPRINT=${{ steps.dependencies.outputs.fingerprint }}
            TABTIN_SOURCE_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=tabtin-community-django
          cache-to: type=gha,mode=max,scope=tabtin-community-django

      - name: Configure restricted SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TABTIN_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TABTIN_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/tabtin_deploy"
          chmod 0600 "$HOME/.ssh/tabtin_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Pull and deploy selected image
        env:
          DEPLOY_HOST: ${{ vars.TABTIN_VPS_HOST }}
          DEPLOY_PORT: ${{ vars.TABTIN_VPS_PORT }}
          DEPLOY_USER: ${{ vars.TABTIN_VPS_USER }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="$IMAGE_NAME@$IMAGE_DIGEST"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/tabtin_deploy" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_SHA $image_ref $REGISTRY_USER"

      - name: Verify public readiness
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://tabtin.dovelora.com/health/ready)"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"status"[[:space:]]*:[[:space:]]*"ready"'
